name: Build Aghniati APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create project files
        run: |
          mkdir -p www

          cat > package.json <<'EOF'
          {
            "name": "aghniati",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/core": "^6.2.0",
              "@capacitor/cli": "^6.2.0",
              "@capacitor/android": "^6.2.0"
            }
          }
          EOF

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.mohamed.aghniati",
            "appName": "Aghniati",
            "webDir": "www",
            "plugins": {
              "CapacitorHttp": { "enabled": true }
            }
          }
          EOF

          cat > www/index.html <<'EOF'
          <!doctype html>
          <html lang="ar" dir="rtl">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
          <title>أغنيتي</title>
          <style>
          :root{--bg:#120f1f;--card:#1c1830;--line:#322b52;--fg:#f3f0ff;--mute:#9c94c4;--acc:#ff7a45;--acc2:#7c5cff}
          *{box-sizing:border-box}
          html,body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
          body{padding:max(16px,env(safe-area-inset-top)) 16px max(28px,env(safe-area-inset-bottom));max-width:640px;margin:auto}
          h1{font-size:26px;margin:8px 0 2px}
          .sub{color:var(--mute);margin:0 0 16px;font-size:14px}
          label,.lbl{display:block;font-size:13px;color:var(--mute);margin:16px 0 6px}
          input,textarea,select{width:100%;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:16px;font-family:inherit}
          textarea{min-height:180px;resize:vertical;line-height:1.7}
          .tabs{display:flex;gap:8px}
          .tab{flex:1;padding:12px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--mute);font-size:15px;font-weight:700;font-family:inherit}
          .tab.on{background:var(--card);color:var(--fg);border-color:var(--acc2)}
          .chips{display:flex;flex-wrap:wrap;gap:8px}
          .chip,.mini{background:transparent;border:1px solid var(--line);color:var(--fg);border-radius:999px;padding:7px 13px;font-size:14px;font-family:inherit}
          .chip.on{background:var(--acc2);border-color:var(--acc2)}
          .mini{font-size:12px;padding:4px 10px;color:var(--mute)}
          .row{display:flex;gap:10px}
          .row>*{flex:1;min-width:0}
          .check{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:15px;color:var(--fg)}
          .check input{width:20px;height:20px;flex:none}
          #go{width:100%;margin-top:22px;padding:15px;border:0;border-radius:12px;font-size:17px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--acc),var(--acc2));font-family:inherit}
          #go:disabled{opacity:.55}
          #cost{margin-top:8px;color:var(--mute);font-size:13px;text-align:center}
          #status{margin-top:14px;color:var(--mute);font-size:14px;min-height:20px}
          #status.err{color:#ff8a8a;white-space:pre-wrap;word-break:break-word}
          .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:14px}
          .card .t{font-size:14px;margin-bottom:6px}
          audio{width:100%;margin-top:6px}
          .acts{display:flex;gap:14px;margin-top:10px;flex-wrap:wrap;align-items:center}
          .acts a,.acts button{color:var(--acc);font-size:14px;background:none;border:0;padding:0;font-family:inherit;text-decoration:underline}
          .hist h2{font-size:15px;color:var(--mute);margin:28px 0 0}
          [data-mode="new"] .only-remix{display:none}
          [data-mode="remix"] .only-new{display:none}
          .hint{font-size:12px;color:var(--mute);margin-top:6px}
          [data-prov="free"] .only-fal{display:none}
          [data-prov="fal"] .only-free{display:none}
          </style>
          </head>
          <body data-mode="new" data-prov="free">
          <h1>🎵 أغنيتي</h1>
          <p class="sub">كتب الكلمات، اختار الأسلوب والآلات، والذكاء الاصطناعي يغنيهالك.</p>

          <div class="tabs">
            <button class="tab on" id="tabNew" type="button">أغنية جديدة</button>
            <button class="tab" id="tabRemix" type="button">ريميكس (بدّل الآلة أو النوع)</button>
          </div>

          <label for="prov">المحرك</label>
          <select id="prov">
            <option value="free">مجاني (سيرفرك في Google Colab)</option>
            <option value="fal">fal.ai (بالدفع، أسرع)</option>
          </select>
          <div class="only-free">
            <label for="srv">رابط السيرفر (يظهرلك في Colab)</label>
            <input id="srv" type="url" dir="ltr" placeholder="https://xxxx.trycloudflare.com" autocomplete="off">
          </div>
          <div class="only-fal">
            <label for="key">مفتاح fal.ai (يتحفظ في التليفون)</label>
            <input id="key" type="password" placeholder="مفتاح API" autocomplete="off">
          </div>

          <div class="only-remix">
            <div class="lbl">الأغنية الأصلية</div>
            <input id="file" type="file" accept="audio/*">
            <div class="hint">ولا اضغط «ريميكس» تحت أي أغنية صنعتها من قبل.</div>
            <div id="srcbox"></div>
            <label for="otags">وصف الأغنية الأصلية (النوع والآلات)</label>
            <input id="otags" maxlength="300" placeholder="مثال: pop, piano, female vocal">
          </div>

          <label for="lyrics">كلمات الأغنية</label>
          <textarea id="lyrics" maxlength="4000" placeholder="[verse]&#10;كلماتك هنا&#10;&#10;[chorus]&#10;المقطع اللي يتعاود"></textarea>
          <div class="chips" style="margin-top:8px">
            <button class="mini" type="button" data-ins="[verse]">+ verse</button>
            <button class="mini" type="button" data-ins="[chorus]">+ chorus</button>
            <button class="mini" type="button" data-ins="[bridge]">+ bridge</button>
            <button class="mini" type="button" data-ins="[outro]">+ outro</button>
          </div>
          <label class="check"><input id="inst" type="checkbox"> موسيقى بلا غناء (instrumental)</label>

          <div class="lbl">النوع</div>
          <div class="chips" id="g_genre"></div>
          <div class="lbl">الآلات</div>
          <div class="chips" id="g_instr"></div>
          <div class="lbl">المزاج</div>
          <div class="chips" id="g_mood"></div>
          <div class="lbl">الصوت</div>
          <div class="chips" id="g_voice"></div>

          <label for="extra">وصف زيادة (بالإنجليزية يخدم أحسن)</label>
          <input id="extra" maxlength="200" placeholder="مثال: slow tempo, warm, reverb">

          <div class="only-new">
            <label for="dur">المدة: <span id="durv">60</span> ثانية</label>
            <input id="dur" type="range" min="15" max="240" step="5" value="60">
            <div class="row">
              <div>
                <label for="bpm">الإيقاع BPM (اختياري)</label>
                <input id="bpm" type="number" inputmode="numeric" min="30" max="300" placeholder="تلقائي">
              </div>
              <div>
                <label for="keyscale">النغمة (اختياري)</label>
                <input id="keyscale" type="text" placeholder="Am, C Major">
              </div>
            </div>
            <div class="row">
              <div>
                <label for="vl">لغة الغناء</label>
                <select id="vl">
                  <option value="">تلقائي</option>
                  <option value="ar">العربية</option>
                  <option value="fr">Français</option>
                  <option value="en">English</option>
                </select>
              </div>
              <div>
                <label for="nout">عدد النسخ</label>
                <select id="nout">
                  <option value="1">1</option>
                  <option value="2">2</option>
                  <option value="3">3</option>
                </select>
              </div>
            </div>
            <label class="check"><input id="hq" type="checkbox" checked> جودة أحسن (أبطأ وأغلى مرتين)</label>
          </div>

          <button id="go" type="button">اصنع الأغنية</button>
          <div id="cost"></div>
          <div id="status"></div>
          <div id="result"></div>
          <div class="hist" id="hist"></div>

          <script>
          var $ = function(id){ return document.getElementById(id); };
          var store = {
            get: function(k){ try { return localStorage.getItem(k) || ''; } catch(e){ return ''; } },
            set: function(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
          };
          var sleep = function(ms){ return new Promise(function(r){ setTimeout(r,ms); }); };
          var state = { mode: 'new', srcUrl: '', srcLyrics: '' };

          var GROUPS = {
            genre: [['rai','راي'],['chaabi','شعبي'],['gnawa','قناوة'],['pop','بوب'],['hip hop','هيب هوب'],['lofi','لوفي'],['rock','روك'],['ballad','أغنية هادئة'],['oriental','شرقي'],['reggae','ريغي'],['edm','إلكترونيك']],
            instr: [['acoustic guitar','جيتار'],['electric guitar','جيتار كهربائي'],['piano','بيانو'],['oud','عود'],['violin','كمان'],['darbuka','دربوكة'],['flute','ناي'],['synth','سينث'],['strings','أوتار'],['drums','طبول']],
            mood: [['sad','حزينة'],['happy','فرحانة'],['romantic','رومانسية'],['energetic','حماسية'],['calm','هادئة'],['epic','ملحمية'],['nostalgic','حنين']],
            voice: [['male vocal','صوت رجل'],['female vocal','صوت امرأة'],['choir','كورال']]
          };
          Object.keys(GROUPS).forEach(function(g){
            var box = $('g_' + g);
            GROUPS[g].forEach(function(p){
              var b = document.createElement('button');
              b.type = 'button'; b.className = 'chip'; b.dataset.t = p[0]; b.textContent = p[1];
              b.addEventListener('click', function(){ b.classList.toggle('on'); });
              box.appendChild(b);
            });
          });

          function buildTags(){
            var t = [];
            document.querySelectorAll('.chip.on').forEach(function(c){ t.push(c.dataset.t); });
            var x = $('extra').value.trim(); if (x) t.push(x);
            return t.join(', ').slice(0, 500);
          }
          function setTags(str){
            document.querySelectorAll('.chip').forEach(function(c){ c.classList.remove('on'); });
            var left = [];
            str.split(',').forEach(function(s){
              s = s.trim(); if (!s) return;
              var chip = null;
              document.querySelectorAll('.chip').forEach(function(c){ if (c.dataset.t === s) chip = c; });
              if (chip) chip.classList.add('on'); else left.push(s);
            });
            $('extra').value = left.join(', ');
          }

          $('key').value = store.get('fal_key');
          $('srv').value = store.get('srv');
          function setProv(p){
            $('prov').value = p; document.body.dataset.prov = p; store.set('prov', p);
            if (p === 'free') setMode('new'); else updateCost();
          }
          $('prov').addEventListener('change', function(){ setProv(this.value); });

          document.querySelectorAll('[data-ins]').forEach(function(b){
            b.addEventListener('click', function(){
              var l = $('lyrics'); var v = l.value;
              l.value = v + (v && v.slice(-1) !== '\n' ? '\n\n' : '') + b.dataset.ins + '\n';
              l.focus();
            });
          });

          function setMode(m){
            state.mode = m; document.body.dataset.mode = m;
            $('tabNew').classList.toggle('on', m === 'new');
            $('tabRemix').classList.toggle('on', m === 'remix');
            $('go').textContent = m === 'new' ? 'اصنع الأغنية' : 'اصنع الريميكس';
            updateCost();
          }
          $('tabNew').addEventListener('click', function(){ setMode('new'); });
          $('tabRemix').addEventListener('click', function(){
            if ($('prov').value === 'free'){ setProv('fal'); }
            setMode('remix');
          });

          function updateCost(){
            $('durv').textContent = $('dur').value;
            if (state.mode !== 'new' || $('prov').value === 'free'){ $('cost').textContent = ''; return; }
            var c = Number($('dur').value) * 0.0003 * ($('hq').checked ? 2 : 1) * Number($('nout').value);
            $('cost').textContent = 'التكلفة التقريبية: ' + c.toFixed(3) + ' دولار';
          }
          ['dur','hq','nout'].forEach(function(i){ $(i).addEventListener('input', updateCost); $(i).addEventListener('change', updateCost); });

          function showSource(url, label){
            var b = $('srcbox'); b.innerHTML = '';
            var d = document.createElement('div'); d.className = 'card';
            var t = document.createElement('div'); t.className = 't'; t.textContent = label;
            var a = document.createElement('audio'); a.controls = true; a.src = url;
            d.appendChild(t); d.appendChild(a); b.appendChild(d);
          }

          $('file').addEventListener('change', function(){
            var f = this.files && this.files[0]; if (!f) return;
            if (f.size > 10 * 1024 * 1024){ setStatus('الملف كبير برشا (أكثر من 10 ميغا). اختار ملف أصغر.', true); return; }
            var fr = new FileReader();
            fr.onload = function(){ state.srcUrl = fr.result; state.srcLyrics = ''; showSource(fr.result, f.name); setStatus(''); };
            fr.readAsDataURL(f);
          });

          function startRemix(item){
            state.srcUrl = item.url; state.srcLyrics = item.lyrics || '';
            $('otags').value = item.tags || '';
            $('lyrics').value = item.lyrics || '';
            setTags('');
            showSource(item.url, item.title);
            setMode('remix');
            window.scrollTo(0, 0);
            setStatus('اختار الآلة أو النوع الجديد (مثلا جيتار) وبعدها اضغط «اصنع الريميكس».');
          }

          function setStatus(t, isErr){ var s = $('status'); s.textContent = t; s.className = isErr ? 'err' : ''; }

          function errText(j){
            if (!j) return 'خطأ غير معروف';
            if (typeof j.detail === 'string') return j.detail;
            if (j.detail) return JSON.stringify(j.detail);
            if (j.message) return j.message;
            return JSON.stringify(j);
          }

          function history(){ try { return JSON.parse(store.get('hist2') || '[]'); } catch(e){ return []; } }

          function songCard(item, withNew){
            var d = document.createElement('div'); d.className = 'card';
            var t = document.createElement('div'); t.className = 't'; t.textContent = item.title;
            var a = document.createElement('audio'); a.controls = true; a.preload = 'none'; a.src = item.url;
            var acts = document.createElement('div'); acts.className = 'acts';
            var dl = document.createElement('a'); dl.href = item.url; dl.target = '_blank'; dl.textContent = 'تحميل';
            var rm = document.createElement('button'); rm.type = 'button'; rm.textContent = '🎸 ريميكس بآلة أو نوع آخر';
            rm.addEventListener('click', function(){ startRemix(item); });
            acts.appendChild(dl); acts.appendChild(rm);
            d.appendChild(t); d.appendChild(a); d.appendChild(acts);
            return d;
          }

          function renderHist(){
            var h = history(); var box = $('hist'); box.innerHTML = '';
            if (!h.length) return;
            var t = document.createElement('h2'); t.textContent = 'أغانيك السابقة'; box.appendChild(t);
            h.forEach(function(x){ box.appendChild(songCard(x)); });
          }

          function finishSongs(urls, lyrics, tags, inst){
            var first = lyrics.split('\n').filter(function(x){ return x.trim() && x.trim()[0] !== '['; })[0];
            var title = first || (inst ? 'موسيقى' : 'أغنية');
            var h = history(); var box = $('result');
            urls.forEach(function(u, i){
              var item = { title: title + (urls.length > 1 ? ' (' + (i + 1) + ')' : ''), url: u, tags: tags, lyrics: inst ? '' : lyrics };
              box.appendChild(songCard(item));
              h.unshift(item);
            });
            store.set('hist2', JSON.stringify(h.slice(0, 15)));
            renderHist();
          }

          async function generateFree(srv, tags, lyrics, inst){
            if (state.mode !== 'new'){ setStatus('الريميكس يخدم برك مع fal.ai (بالدفع).', true); return; }
            store.set('srv', srv);
            var body = { caption: tags || 'pop song', lyrics: inst ? '[Instrumental]' : lyrics.slice(0, 4096),
                         vocal_language: $('vl').value || 'ar', audio_duration: Number($('dur').value),
                         thinking: $('hq').checked, audio_format: 'mp3', batch_size: Number($('nout').value) };
            var bpm = parseInt($('bpm').value, 10); if (bpm >= 30 && bpm <= 300) body.bpm = bpm;
            var ks = $('keyscale').value.trim(); if (ks) body.key_scale = ks;
            $('go').disabled = true; $('result').innerHTML = '';
            try {
              setStatus('نبعثو الطلب للسيرفر...');
              var r = await fetch(srv + '/v1/music/generate', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
              var j = await r.json();
              if (!r.ok) throw new Error(errText(j));
              var id = (j.data || j).job_id;
              if (!id) throw new Error('ما جاش رقم المهمة: ' + JSON.stringify(j));
              var n = 0, res;
              while (true){
                await sleep(3000); n++;
                var sr = await fetch(srv + '/v1/jobs/' + id);
                var sj = await sr.json();
                if (!sr.ok) throw new Error(errText(sj));
                var s = sj.data || sj;
                if (s.status === 'succeeded'){ res = s.result; break; }
                if (s.status === 'failed') throw new Error(s.error ? String(s.error) : 'فشلت المهمة');
                setStatus((s.status === 'queued' ? 'في الطابور...' : 'الذكاء الاصطناعي يخدم على الأغنية...') + ' (' + (n * 3) + ' ثانية)');
                if (n > 400) throw new Error('طولت برشا، عاود جرب');
              }
              if (typeof res === 'string'){ try { res = JSON.parse(res); } catch(e){} }
              var paths = (res && res.audio_paths) || (res && res.first_audio_path ? [res.first_audio_path] : []);
              var urls = paths.map(function(p){
                if (/^https?:/.test(p)) return p;
                if (p.indexOf('/v1/audio') === 0) return srv + p;
                return srv + '/v1/audio?path=' + encodeURIComponent(p);
              });
              if (!urls.length) throw new Error('ما جاش رابط الأغنية: ' + JSON.stringify(res));
              setStatus('');
              finishSongs(urls, lyrics, tags, inst);
            } catch (e) {
              setStatus('صرات مشكلة:\n' + (e && e.message ? e.message : e) + '\n\nتأكد أن Colab مازال خدام.', true);
            } finally {
              $('go').disabled = false;
            }
          }

          async function generate(){
            var key = $('key').value.trim();
            var lyrics = $('lyrics').value.trim();
            var inst = $('inst').checked;
            var tags = buildTags();
            var free = $('prov').value === 'free';
            var srv = $('srv').value.trim().replace(/\/+$/, '');
            if (free && !/^https?:\/\//.test(srv)){ setStatus('دخل رابط السيرفر اللي يظهرلك في Colab', true); return; }
            if (!free && !key){ setStatus('دخل مفتاح fal.ai', true); return; }
            if (!inst && !lyrics){ setStatus('كتب الكلمات الأول، ولا فعّل «موسيقى بلا غناء»', true); return; }
            if (free){ return generateFree(srv, tags, lyrics, inst); }
            var model, body;
            if (state.mode === 'new'){
              model = 'fal-ai/ace-step-1.5';
              body = { prompt: tags || 'pop song', lyrics: inst ? '[Instrumental]' : lyrics.slice(0, 4096),
                       duration: Number($('dur').value), thinking: $('hq').checked, num_outputs: Number($('nout').value) };
              var bpm = parseInt($('bpm').value, 10); if (bpm >= 30 && bpm <= 300) body.bpm = bpm;
              var ks = $('keyscale').value.trim(); if (ks) body.key_scale = ks;
              var vl = $('vl').value; if (vl) body.vocal_language = vl;
            } else {
              if (!state.srcUrl){ setStatus('اختار الأغنية الأصلية الأول', true); return; }
              model = 'fal-ai/ace-step/audio-to-audio';
              body = { audio_url: state.srcUrl, edit_mode: 'remix',
                       original_tags: $('otags').value.trim() || 'song', original_lyrics: state.srcLyrics || '',
                       tags: tags || 'pop', lyrics: inst ? '[inst]' : lyrics.slice(0, 4096) };
            }
            store.set('fal_key', key);
            var headers = { 'Authorization': 'Key ' + key, 'Content-Type': 'application/json' };
            $('go').disabled = true; $('result').innerHTML = '';
            try {
              setStatus('نبعثو الطلب...');
              var r = await fetch('https://queue.fal.run/' + model, { method: 'POST', headers: headers, body: JSON.stringify(body) });
              var j = await r.json();
              if (!r.ok) throw new Error(errText(j));
              var n = 0;
              while (true){
                await sleep(3000); n++;
                var sr = await fetch(j.status_url, { headers: headers });
                var s = await sr.json();
                if (!sr.ok) throw new Error(errText(s));
                if (s.status === 'COMPLETED') break;
                if (s.status === 'FAILED' || s.error) throw new Error(errText(s));
                setStatus((s.status === 'IN_QUEUE' ? 'في الطابور...' : 'الذكاء الاصطناعي يخدم على الأغنية...') + ' (' + (n * 3) + ' ثانية)');
                if (n > 300) throw new Error('طولت برشا، عاود جرب');
              }
              var rr = await fetch(j.response_url, { headers: headers });
              var out = await rr.json();
              if (!rr.ok) throw new Error(errText(out));
              var urls = [];
              if (out.audios && out.audios.length) out.audios.forEach(function(x){ if (x.audio && x.audio.url) urls.push(x.audio.url); });
              else if (out.audio && out.audio.url) urls.push(out.audio.url);
              if (!urls.length) throw new Error('ما جاش رابط الأغنية: ' + JSON.stringify(out));
              setStatus('');
              var first = lyrics.split('\n').filter(function(x){ return x.trim() && x.trim()[0] !== '['; })[0];
              var title = (state.mode === 'remix' ? 'ريميكس: ' : '') + (first || (inst ? 'موسيقى' : 'أغنية'));
              var h = history();
              var box = $('result');
              urls.forEach(function(u, i){
                var item = { title: title + (urls.length > 1 ? ' (' + (i + 1) + ')' : ''), url: u, tags: tags, lyrics: inst ? '' : lyrics };
                box.appendChild(songCard(item));
                h.unshift(item);
              });
              store.set('hist2', JSON.stringify(h.slice(0, 15)));
              renderHist();
            } catch (e) {
              setStatus('صرات مشكلة:\n' + (e && e.message ? e.message : e), true);
            } finally {
              $('go').disabled = false;
            }
          }

          $('go').addEventListener('click', generate);
          renderHist();
          setProv(store.get('prov') === 'fal' ? 'fal' : 'free');
          </script>
          </body>
          </html>
          EOF

      - name: Install and build
        run: |
          npm install
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Aghniati-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
